[package]
name = "searchium-server"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.71"
async-stream = "0.3.5"
futures = "0.3.28"
futures-core = "0.3.28"
grep = "0.3.1"
ignore = "=0.4.20"
memchr = "2.7.1"
memory-stats = "1.0.0"
pbjson = "0.6.0"
prost = "0.12.3"
prost-types = "0.12.3"
rayon = "1.7.0"
regex = "1.10.3"
scc = "2.0.16"
serde = "1.0"
thiserror = "1.0.40"
tokio = { version = "1.27.0", features = ["rt", "rt-multi-thread", "macros"] }
tokio-stream = { version = "0.1.12", features = ["sync"] }
tokio-util = "0.7.7"
tonic = "0.11.0"
tracing = "0.1.40"
tracing-subscriber = {version = "0.3.16", features=["std", "fmt", "env-filter"]}
